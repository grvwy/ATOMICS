name: Web bundle

# The ATOMICS web client as a release artifact (docs/daemon.md, "The browser client and its embedding"):
# atomics-web-<version>.tar.gz and its .sha256, on every tag, and on demand from any branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install trunk and wasm-bindgen
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
        with:
          # wasm-bindgen must equal the crate version in Cargo.lock.
          tool: trunk@0.21.14,wasm-bindgen@0.2.129
      - name: Build
        env:
          BUILT_FROM: ${{ github.sha }}
          JOBS: '2'
        run: scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: atomics-web
          path: |
            target/web/atomics-web-*.tar.gz
            target/web/atomics-web-*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atomics-web
          path: target/web
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(target/web/atomics-web-*.tar.gz target/web/atomics-web-*.tar.gz.sha256)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes ''
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
