name: Web bundle

# The ATOMICS web client as a release artifact (docs/daemon.md, "The browser client and its embedding"):
# atomics-web-<version>.tar.gz and its .sha256, on every tag, and on demand from any branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install trunk and wasm-bindgen
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
        with:
          # wasm-bindgen must equal the crate version in Cargo.lock.
          tool: trunk@0.21.14,wasm-bindgen@0.2.129
      - name: Build
        env:
          BUILT_FROM: ${{ github.sha }}
          JOBS: '2'
        run: scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: atomics-web
          path: |
            target/web/atomics-web-*.tar.gz
            target/web/atomics-web-*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atomics-web
          path: target/web
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(target/web/atomics-web-*.tar.gz target/web/atomics-web-*.tar.gz.sha256)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes ''
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      TARGET: ${{ matrix.target }}
    steps:
      - name: Require the release signing key
        env:
          ATOMICS_RELEASE_SIGNING_KEY: ${{ secrets.ATOMICS_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$ATOMICS_RELEASE_SIGNING_KEY" ]; then
            echo '::error::Set the ATOMICS_RELEASE_SIGNING_KEY repository secret to an Ed25519 private key in PKCS#8 PEM format; see docs/releasing.md.'
            exit 1
          fi
      - uses: actions/checkout@v6
      - name: Check the release version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo '::error::The version tag must match workspace.package.version in Cargo.toml.'
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Select OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Build and pack the desktop
        id: pack
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          out="$GITHUB_WORKSPACE/target/desktop"
          archive="atomics-$VERSION-$TARGET.tar.gz"
          mkdir -p "$out"
          if [ "$RUNNER_OS" = Linux ]; then
            cargo build --release --locked -p atomics --target "$TARGET"
            tar -czf "$out/$archive" -C "target/$TARGET/release" atomics
          else
            CARGO_BUILD_TARGET="$TARGET" scripts/macos-app.sh "$out"
            tar -czf "$out/$archive" -C "$out" ATOMICS.app
          fi
          (cd "$out" && shasum -a 256 "$archive" > "$archive.sha256")
          echo "archive=$out/$archive" >> "$GITHUB_OUTPUT"
      - name: Sign and verify the archive
        env:
          ATOMICS_RELEASE_SIGNING_KEY: ${{ secrets.ATOMICS_RELEASE_SIGNING_KEY }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: sh scripts/sign-release.sh "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: atomics-desktop-${{ matrix.target }}
          path: |
            target/desktop/atomics-*.tar.gz
            target/desktop/atomics-*.tar.gz.sha256
            target/desktop/atomics-*.tar.gz.sig
          if-no-files-found: error

  desktop-release:
    # The web job creates the release. Desktop failures never block its upload.
    needs: [desktop, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: atomics-desktop-*
          merge-multiple: true
          path: target/desktop
      - name: Attach desktop builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(target/desktop/atomics-*.tar.gz target/desktop/atomics-*.tar.gz.sha256 target/desktop/atomics-*.tar.gz.sig)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
