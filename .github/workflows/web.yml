name: Web bundle

# The ATOMICS web client as a release artifact (docs/daemon.md, "The browser client and its embedding"):
# atomics-web-<version>.tar.gz and its .sha256, on every tag, and on demand from any branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      vm_image:
        description: Also build the VM image, to prove its job without cutting a tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install trunk and wasm-bindgen
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
        with:
          # wasm-bindgen must equal the crate version in Cargo.lock.
          tool: trunk@0.21.14,wasm-bindgen@0.2.129
      - name: Build
        env:
          BUILT_FROM: ${{ github.sha }}
          JOBS: '2'
        run: scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: atomics-web
          path: |
            target/web/atomics-web-*.tar.gz
            target/web/atomics-web-*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atomics-web
          path: target/web
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(target/web/atomics-web-*.tar.gz target/web/atomics-web-*.tar.gz.sha256)
          # A prerelease until its signed desktop builds are attached, which waits for a person. The latest release is
          # what installs and updates read, so they keep the one before this, and never find a release with no build.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes ''
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - name: Check the release version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo '::error::The version tag must match workspace.package.version in Cargo.toml.'
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # A build carries its trust anchors from here on, so one without both could never be recovered from a lost key.
      - name: Require both release keys in this commit
        run: |
          for key in assets/release-signing-key.pub assets/release-signing-key-offline.pub; do
            if [ ! -f "$key" ]; then
              echo "::error::$key is missing; docs/releasing.md says how to make the release keys."
              exit 1
            fi
          done
          if cmp -s assets/release-signing-key.pub assets/release-signing-key-offline.pub; then
            echo '::error::The two release keys are the same key.'
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Build and pack the desktop
        id: pack
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          out="$GITHUB_WORKSPACE/target/desktop"
          archive="atomics-$VERSION-$TARGET.tar.gz"
          mkdir -p "$out"
          if [ "$RUNNER_OS" = Linux ]; then
            cargo build --release --locked -p atomics --target "$TARGET"
            tar -czf "$out/$archive" -C "target/$TARGET/release" atomics
          else
            CARGO_BUILD_TARGET="$TARGET" scripts/macos-app.sh "$out"
            tar -czf "$out/$archive" -C "$out" ATOMICS.app
          fi
          # Only a debug build can name another release feed or key: a release must not hold that path at all.
          program="target/$TARGET/release/atomics"
          if grep -q ATOMICS_TEST_RELEASE_FEED "$program"; then
            echo '::error::This release build holds the test release feed.'
            exit 1
          fi
          (cd "$out" && shasum -a 256 "$archive" > "$archive.sha256")
          echo "archive=$out/$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: atomics-unsigned-${{ matrix.target }}
          path: |
            target/desktop/atomics-*.tar.gz
            target/desktop/atomics-*.tar.gz.sha256
          if-no-files-found: error

  vm-image:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.vm_image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nix-bin zstd
          sudo mkdir -p /etc/nix
          echo 'experimental-features = nix-command flakes' | sudo tee -a /etc/nix/nix.conf
          sudo systemctl enable --now nix-daemon.socket
          # Ubuntu's package keeps the socket's folder to the nix-users group, which this login joined too late to count.
          sudo chmod a+rx /nix/var/nix/daemon-socket
          sudo chmod a+rw /nix/var/nix/daemon-socket/socket
      - name: Build the generic image and bundle template
        run: bash scripts/release-vm-image.sh
      - uses: actions/upload-artifact@v4
        with:
          name: atomics-unsigned-vm
          path: target/vm-release/*
          if-no-files-found: error

  # The only job that sees the signing key, and only once a person has approved it. Everything a build runs runs in the
  # jobs above, on other machines, so nothing in the dependency tree comes near the key: no build, no cargo, no cache, and
  # the signing script from the tagged commit. What it signs is data to it. Each action is pinned to a commit, since an
  # action that moved could otherwise leave something behind for the step that holds the key.
  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Sign the desktop and VM builds
    needs: [desktop, vm-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: atomics-unsigned-*
          merge-multiple: true
          path: ${{ runner.temp }}/unsigned
      # By the names this release should have, and never by what the artifacts happen to hold.
      - name: Check what the builds made
        env:
          UNSIGNED: ${{ runner.temp }}/unsigned
        run: |
          version=${GITHUB_REF_NAME#v}
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            archive="atomics-$version-$target.tar.gz"
            if [ -L "$UNSIGNED/$archive" ] || [ ! -f "$UNSIGNED/$archive" ]; then
              echo "::error::The builds did not make $archive."
              exit 1
            fi
            (cd "$UNSIGNED" && sha256sum --check --strict "$archive.sha256")
          done
          for suffix in raw.zst bundle.json; do
            archive="atomics-vm-$version-aarch64-linux.$suffix"
            if [ -L "$UNSIGNED/$archive" ] || [ ! -f "$UNSIGNED/$archive" ]; then
              echo "::error::The builds did not make $archive."
              exit 1
            fi
            (cd "$UNSIGNED" && sha256sum --check --strict "$archive.sha256")
          done
      - name: Sign and verify each archive
        env:
          ATOMICS_RELEASE_SIGNING_KEY: ${{ secrets.ATOMICS_RELEASE_SIGNING_KEY }}
          UNSIGNED: ${{ runner.temp }}/unsigned
        run: |
          version=${GITHUB_REF_NAME#v}
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            sh scripts/sign-release.sh "$UNSIGNED/atomics-$version-$target.tar.gz"
          done
          for suffix in raw.zst bundle.json; do
            sh scripts/sign-release.sh "$UNSIGNED/atomics-vm-$version-aarch64-linux.$suffix"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atomics-signatures
          path: ${{ runner.temp }}/unsigned/atomics-*.sig
          if-no-files-found: error

  desktop-release:
    # The web job creates the release. Desktop failures and a signature nobody approved never block its upload.
    needs: [sign, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: atomics-unsigned-*
          merge-multiple: true
          path: target/desktop
      - uses: actions/download-artifact@v4
        with:
          name: atomics-signatures
          path: target/desktop
      - name: Attach desktop builds to the release, and make it the latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(target/desktop/atomics-*.tar.gz{,.sha256,.sig} target/desktop/atomics-vm-*.raw.zst{,.sha256,.sig} target/desktop/atomics-vm-*.bundle.json{,.sha256,.sig})
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
